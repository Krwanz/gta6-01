<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Story</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a2230; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hint { position: fixed; left: 10px; bottom: 8px; color: rgba(255,255,255,0.55); font: 12px sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Steal cars, outrun the police, and work off Rico's debt one mission at a time."></canvas>
<p id="status" role="status" aria-live="polite">Solmar Bay loading.</p>
<div id="hint">Solmar Bay — WASD move/drive · E steal car · Space punch · Click shoot · P pause</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
